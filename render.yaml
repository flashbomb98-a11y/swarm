# OPSLY NEW SWARM: ISOLATED NEON DEPLOYMENT BLUEPRINT
#
# Creates ONLY one Render free Go web service, no Render database, no disks,
# no external paid services. The existing division-swarm-final-postgres and
# division-swarm-pg16 resources are intentionally NOT included or modified.
#
# Neon direct connection (not transaction pooler) is required by Swarm's
# session-level PostgreSQL advisory lock. No password is committed to GitHub.
#
# Initial Render Blueprint setup prompts for DB_PASSWORD securely.
# Get this from your Neon console – do not post it in chat.
services:
  - type: web
    name: opsly-new-buyer-intent
    runtime: go
    region: frankfurt
    plan: free
    repo: https://github.com/flashbomb98-a11y/swarm
    branch: master
    autoDeployTrigger: 'off'
    buildCommand: go build -o swarm ./cmd/swarm && go build -o opsly-portgate ./opsly/deploy/render/cmd/portgate
    startCommand: bash opsly/deploy/render/start.sh
    healthCheckPath: /_opsly/gate/ready
    maxShutdownDelaySeconds: 60
    envVars:
      - key: DB_HOST
        value: ep-dawn-silence-b193cq88.c-5.eu-central-1.aws.neon.tech
      - key: DB_NAME
        value: neondb
      - key: DB_USER
        value: neondb_owner
      - key: DB_PASSWORD
        sync: false
      - key: SWARM_API_TOKEN
        generateValue: true
