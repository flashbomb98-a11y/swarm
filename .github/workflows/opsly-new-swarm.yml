name: OPSLY New Swarm — isolated intake checks

on:
  push:
    branches: [opsly/new-swarm]
    paths:
      - 'opsly/buyer-intent-hunter/**'
      - 'opsly/tools/buyer-intent/**'
      - 'opsly/deploy/render/**'
      - '.github/workflows/opsly-new-swarm.yml'
  workflow_dispatch:

concurrency:
  group: opsly-intake-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  intake:
    name: Offline intake + Division contract checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Validate safe Render launcher (no live start)
        shell: bash
        run: |
          set -euo pipefail
          bash -n opsly/deploy/render/start.sh
          set +e
          env -u DB_HOST -u DB_NAME -u DB_USER -u DB_PASSWORD -u SWARM_API_TOKEN bash opsly/deploy/render/start.sh > /tmp/opsly-expected-block 2>&1
          code=$?
          set -e
          test "$code" -eq 78
          grep -q 'DB_HOST' /tmp/opsly-expected-block
      - name: Verify buyer intent Division contract
        run: go run ./cmd/swarm verify opsly/buyer-intent-hunter --portable
      - name: Exercise synthetic intake event in isolated runtime
        run: go run ./cmd/swarm test opsly/buyer-intent-hunter
      - name: Python unit tests (application has no network calls)
        run: python3 -B -m unittest discover -s opsly/tools/buyer-intent/tests -p 'test_*.py' -v
